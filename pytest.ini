[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # MoviePy: ao falhar em abrir um arquivo de audio invalido, o __del__ do
    # FFMPEG_AudioReader tenta fechar um processo que nunca foi criado.
    ignore:Exception ignored in. <function FFMPEG_AudioReader.__del__:pytest.PytestUnraisableExceptionWarning
